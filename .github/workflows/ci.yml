name: CI

on:
  push:
    branches: [main, 'claude/**', foundation, 'modules-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandpack:
    name: Sandpack runner check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=sandpack
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: sandpack-report
          path: playwright-report/
          retention-days: 7
